document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:999px;padding:5px 14px;font-size:13px;font-weight:600\">{{ typeLabel }}<\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:700;line-height:1.55;text-wrap:pretty\">{{ qText }}<\u002Fdiv>\n          <sc-if value=\"{{ hasQuote }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#F6F7F9;border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.8;color:#5E6789\">{{ quote }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isOptions }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"min-height:56px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:{{ o.bg }};border:2px solid {{ o.bd }};color:#111B44;font-size:16px;line-height:1.6;text-align:right;cursor:pointer;transition:background .15s,border-color .15s\">\n                <span style=\"width:24px;height:24px;flex-shrink:0;border-radius:{{ o.markRadius }};border:2px solid {{ o.markBd }};background:{{ o.markBg }};display:flex;align-items:center;justify-content:center;color:#FFFFFF;box-sizing:border-box\">\n                  <sc-if value=\"{{ o.on }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"flex:1;min-width:0\">{{ o.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isOrder }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ orderItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:16px;background:{{ it.bg }};border:2px solid {{ it.bd }}\">\n                <span style=\"width:34px;height:34px;border-radius:10px;background:#111B44;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0\">{{ it.n }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0;font-size:16px;font-weight:500;line-height:1.5\">{{ it.label }}<\u002Fspan>\n                <div style=\"display:flex;gap:6px\">\n                  <button sc-camel-on-click=\"{{ it.up }}\" aria-label=\"أعلى\" style=\"width:44px;height:44px;border-radius:12px;border:2px solid #D9DCE5;background:#FFFFFF;color:#111B44;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{ it.upOp }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m18 15-6-6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ it.down }}\" aria-label=\"أسفل\" style=\"width:44px;height:44px;border-radius:12px;border:2px solid #D9DCE5;background:#FFFFFF;color:#111B44;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{ it.downOp }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isMatch }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div sty >\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <textarea value=\"{{ openText }}\" sc-camel-on-change=\"{{ onText }}\" sc-camel-read-only=\"{{ checked }}\" placeholder=\"اكتب صياغتك هنا…\" style=\"min-height:140px;resize:vertical;border:2px solid #D9DCE5;border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.8;color:#111B44;outline:none;background:#FFFFFF;direction:rtl\" style-focus=\"border-color:#C50076\"><\u002Ftextarea>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ checked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-radius:18px;padding:16px 18px;background:{{ fbBg }};display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:16px;font-weight:700;color:{{ fbFg }}\">{{ fbTitle }}<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.8;color:#111B44;text-wrap:pretty\">{{ fbText }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"flex:1\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ primary }}\" style=\"height:58px;border:0;border-radius:999px;background:{{ btnBg }};color:{{ btnFg }};font-size:18px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s\">{{ btnLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;padding:32px 26px 26px;gap:24px\">\n        <div style=\"display:flex;height:8px;border-radius:4px;overflow:hidden;width:120px\"><div style=\"flex:1;background:#3D4770\"><\u002Fdiv><div style=\"flex:1;background:#C50076\"><\u002Fdiv><div style=\"flex:1;background:#111B44\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px\">\n          <div style=\"font-size:30px;font-weight:700;line-height:1.4\">شكرًا لك<\u002Fdiv>\n          <div style=\"background:#111B44;color:#FFFFFF;border-radius:24px;padding:26px 24px;display:flex;align-items:center;gap:20px\">\n            <div style=\"display:flex;align-items:baseline;gap:4px;flex-shrink:0\"><span style=\"font-size:60px;font-weight:700;line-height:1\">{{ score }}<\u002Fspan><span style=\"font-size:20px;color:#E894C3\">/ {{ scored }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:18px;font-weight:600\">{{ verdict }}<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;opacity:.9\">{{ verdictSub }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:14px;font-weight:600;color:#5E6789\">ملخص إجاباتك<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px\">\n              <sc-for list=\"{{ summary }}\" as=\"s\" hint-placeholder-count=\"10\">\n                <div style=\"height:44px;border-radius:12px;background:{{ s.bg }};color:{{ s.fg }};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700\">{{ s.n }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:16px;font-size:13px;color:#5E6789;flex-wrap:wrap\"><span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:12px;border-radius:4px;background:#1F7A55\"><\u002Fspan>صحيحة<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:12px;border-radius:4px;background:#C50076\"><\u002Fspan>تحتاج مراجعة<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:12px;border-radius:4px;background:#D9DCE5\"><\u002Fspan>إجابة مفتوحة<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.8;color:#5E6789;text-wrap:pretty\">ارجع إلى دليل المتدرب كلما احتجت. القاضي لا يحتاج إلى مذكرة أطول، بل إلى مذكرة أوضح.<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ restart }}\" style=\"height:58px;border:2px solid #111B44;border-radius:999px;background:#FFFFFF;color:#111B44;font-size:18px;font-weight:600;cursor:pointer\" style-hover=\"background:#F6F7F9\">أعد المحاولة<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'jm-quiz-v1';\nconst SEC = { 1: ['#3D4770', '#ECEDF2'], 2: ['#A80065', '#FAE6F1'], 3: ['#111B44', '#D9DCE5'] };\nconst PC = ['#111B44', '#C50076', '#3D4770', '#A80065'];\nconst TYPE = { single: 'اختر إجابة واحدة', multi: 'اختر كل ما ينطبق', tf: 'صح أم خطأ', order: 'رتّب العناصر', match: 'صِل كل عنصر بما يقابله', open: 'إجابة مفتوحة' };\nconst Q = [\n  { type: 'single', sec: 1, q: 'ما المذكرة القضائية في جوهرها؟', opts: ['تجميع شامل للوقائع والنصوص', 'استعراض لكل ما يعرفه المحامي في المسألة', 'أداة لإقناع المحكمة بنتيجة محددة', 'سرد زمني لمراحل النزاع'], correct: 2, explain: 'المذكرة أداة إقناع بنتيجة محددة، من خلال عرض منظم للوقائع المنتجة، والقاعدة القانونية، والتطبيق، والطلبات.' },\n  { type: 'single', sec: 1, q: 'حفظتَ المذكرة في النظام قبل الموعد بساعة ولم تُكمل الإرسال. ما الحكم؟', opts: ['تُعد مقدَّمة لأن الحفظ تم قبل الموعد', 'لا تُعد مقدَّمة؛ الحفظ ليس تقديمًا', 'تُعد مقدَّمة إذا كانت مذكرة جوابية', 'يُترك الأمر لتقدير الدائرة'], correct: 1, explain: 'الحفظ ليس تقديمًا. استكمل الإرسال، واحفظ رقم الطلب وتاريخه كإثبات للإيداع.' },\n  { type: 'multi', sec: 1, q: 'أيٌّ مما يلي من العناصر الستة التي تراجعها قبل أن تمسك القلم؟', opts: ['طبيعة النزاع', 'الجهة المختصة', 'عدد صفحات المذكرة', 'المرحلة الإجرائية', 'أسلوب الخصم في الكتابة', 'متطلبات تقديم الإجراء'], correct: [0, 1, 3, 5], explain: 'العناصر الستة: طبيعة النزاع، الجهة المختصة، المرحلة الإجرائية، نوع المذكرة، الإجراء الحالي وموعده، متطلبات تقديم الإجراء.' },\n  { type: 'multi', sec: 2, q: 'أيُّ العناوين التالية صيغ كنتيجة لا كوصف؟', opts: ['«ثبوت استلام الشحنة الثالثة»', '«رسالة المشتريات تؤكد وصول الشحنة»', '«انقضاء مهلة الاعتراض على المطابقة»', '«مراسلات الطرفين بشأن الشحنة الرابعة»'], correct: [0, 2], explain: 'القاعدة 4: اجعل العنوان نتيجة لا وصفًا. العنوان الجيد يخبر القاضي بما يثبت، لا بما يحويه المستند.' },\n  { type: 'tf', sec: 2, q: 'كلما طالت المذكرة زادت قدرتها على إقناع القاضي.', opts: ['صح', 'خطأ'], correct: 1, explain: 'القاضي لا يحتاج إلى مذكرة أطول، بل إلى مذكرة أوضح. كل جملة لا تخدم الطلب هي ثانية تضيعها من وقته.' },\n  { type: 'tf', sec: 3, q: 'يجوز الاستشهاد بسابقة قضائية اقترحتها أداة ذكاء اصطناعي دون الرجوع إلى مصدرها الرسمي.', opts: ['صح', 'خطأ'], correct: 1, explain: 'تقترح الأداة، ويقرر المحامي. تحقّق من كل استشهاد على ثلاثة مستويات: الوجود، والمضمون، والسريان والنطاق.' },\n  { type: 'order', sec: 2, q: 'رتّب مراحل كتابة المذكرة الأربع من الأولى إلى الأخيرة.', items: ['المجنون — عصف ذهني حر', 'المهندس — اختيار وترتيب في هيكل', 'النجّار — كتابة المسودة على المخطط', 'القاضي — مراجعة نهائية كأنك ناقد'], start: [2, 0, 3, 1], explain: 'المجنون ← المهندس ← النجّار ← القاضي. الجمع بين مرحلتي المجنون والقاضي في وقت واحد يُوقف الكاتب عن التفكير.' },\n  { type: 'match', sec: 3, q: 'صِل كل عنصر في ورقة الترافع بمضمونه.', left: ['الطلب', 'هدف الجلسة', 'المستندات الأساسية', 'نقطة الضعف'], right: ['واحد، جازم، محدد', 'في جملة واحدة', 'بأرقام مرفقاتها وصفحاتها', 'والرد عليها'], rightOrder: [2, 0, 3, 1], time: 120, explain: 'ورقة الترافع صفحة واحدة تُغنيك عن الملف: الطلب، هدف الجلسة، المسائل محل النزاع، المستندات الأساسية، نقطة الضعف، الأسئلة المتوقعة.' },\n  { type: 'open', sec: 2, q: 'أعد صياغة الجملة التالية بأقصر عبارة دقيقة تؤدي المعنى:', quote: '«وحيث إنه من الثابت والمعلوم أن المدعي قام باستلام الشحنة الثالثة استلامًا فعليًا كما هو واضح وجلي من خلال الرسالة التي أرسلها مدير المشتريات لديها والتي يتبين منها بما لا يدع مجالًا للشك وصول الشحنة»', explain: '«استلمت المدعى عليها الشحنة الثالثة، بتأكيد مدير مشترياتها كتابةً (مرفق رقم 4).» قارن صياغتك: جمل قصيرة، مصطلحات دقيقة، لا حشو.' },\n  { type: 'single', sec: 3, q: 'بماذا تفتتح العرض الشفهي أمام المحكمة؟', opts: ['بمقدمة عن خلفية النزاع', 'بالطلب، ثم دليل كل مسألة', 'بالرد على دفوع الخصم', 'بسرد الوقائع بالترتيب الزمني'], correct: 1, explain: 'تسلسل العرض: الطلب ← المسألة ← الحجة ← الدليل ← الخلاصة. أول نصف دقيقة للطلب ودليل كل شحنة.' },\n];\nconst SCORED = Q.filter(q => q.type !== 'open').length;\n\nclass Component extends DCLogic {\n  fresh() {\n    return { screen: 'cover', i: 0, t: null, r: Q.map(q => ({ sel: q.type === 'multi' ? [] : null, order: q.start ? q.start.slice() : null, pairs: {}, active: null, text: '', checked: false, ok: false })) };\n  }\n  load() {\n    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.r && s.r.length === Q.length) return { ...s, t: s.t ?? null }; } catch (e) {}\n    return null;\n  }\n  state = this.load() || this.fresh();\n  componentDidMount() { this.syncTimer(); }\n  componentDidUpdate() { try { localStorage.setItem(KEY, JSON.stringify(this.state)); } catch (e) {} this.syncTimer(); }\n  componentWillUnmount() { clearInterval(this.iv); this.iv = null; }\n  syncTimer() {\n    const s = this.state, q = Q[s.i];\n    const run = s.screen === 'q' && q.type === 'match' && !s.r[s.i].checked;\n    if (run && s.t == null) { this.setState({ t: q.time }); return; }\n    if (run && !this.iv) {\n      this.iv = setInterval(() => {\n        const t = (this.state.t ?? q.time) - 1;\n        if (t <= 0) { this.setState({ t: 0 }); this.check(true); } else this.setState({ t });\n      }, 1000);\n    }\n    if (!run && this.iv) { clearInterval(this.iv); this.iv = null; }\n  }\n  upd(fn) { this.setState(s => { const r = s.r.slice(); r[s.i] = { ...r[s.i], ...fn(r[s.i]) }; return { r }; }); }\n  answered(q, a) {\n    if (q.type === 'multi') return a.sel.length > 0;\n    if (q.type === 'order') return true;\n    if (q.type === 'match') return Object.keys(a.pairs).length === q.left.length;\n    if (q.type === 'open') return a.text.trim().length >= 3;\n    return a.sel != null;\n  }\n  check(force) {\n    const q = Q[this.state.i], a = this.state.r[this.state.i];\n    if (a.checked || (!force && !this.answered(q, a))) return;\n    let ok = false;\n    if (q.type === 'single' || q.type === 'tf') ok = a.sel === q.correct;\n    else if (q.type === 'multi') ok = a.sel.slice().sort().join() === q.correct.slice().sort().join();\n    else if (q.type === 'order') ok = a.order.every((v, k) => v === k);\n    else if (q.type === 'match') ok = q.left.every((_, k) => a.pairs[k] === k);\n    this.upd(() => ({ checked: true, ok, active: null }));\n  }\n  next() {\n    if (this.state.i < Q.length - 1) this.setState(s => ({ i: s.i + 1, t: null }));\n    else this.setState({ screen: 'result', t: null });\n  }\n  renderVals() {\n    const s = this.state, q = Q[s.i], a = s.r[s.i];\n    const [secColor, secTint] = SEC[q.sec];\n    const done = a.checked;\n    const OKB = '#E4F2EC', OKD = '#1F7A55', BADB = '#FBE7E5', BADD = '#B3261E';\n    const v = {\n      isCover: s.screen === 'cover', isQ: s.screen === 'q', isResult: s.screen === 'result',\n      startLabel: s.r.some(x => x.checked) ? 'تابع من حيث توقفت' : 'ابدأ هنا',\n      start: () => this.setState({ screen: 'q' }),\n      restart: () => this.setState(this.fresh()),\n      qNum: s.i + 1, qTotal: Q.length, progress: ((s.i + (done ? 1 : 0)) / Q.length * 100) + '%',\n      secColor, secTint, typeLabel: TYPE[q.type], qText: q.q, hasQuote: !!q.quote, quote: q.quote || '',\n      isOptions: ['single', 'multi', 'tf'].includes(q.type), isOrder: q.type === 'order', isMatch: q.type === 'match', isOpen: q.type === 'open',\n      checked: done,\n    };\n    if (v.isOptions) {\n      const multi = q.type === 'multi';\n      v.opts = q.opts.map((label, k) => {\n        const on = multi ? a.sel.includes(k) : a.sel === k;\n        const right = multi ? q.correct.includes(k) : q.correct === k;\n        let bg = '#FFFFFF', bd = '#D9DCE5', mb = '#B6BBCC', mf = '#FFFFFF';\n        if (on) { bg = '#F6F7F9'; bd = '#111B44'; mb = '#111B44'; mf = '#111B44'; }\n        if (done && right) { bg = OKB; bd = OKD; mb = OKD; mf = on ? OKD : '#FFFFFF'; }\n        else if (done && on) { bg = BADB; bd = BADD; mb = BADD; mf = BADD; }\n        return { label, on, bg, bd, markBd: mb, markBg: on ? mf : '#FFFFFF', markRadius: multi ? '7px' : '50%',\n          onClick: () => { if (done) return; this.upd(x => ({ sel: multi ? (x.sel.includes(k) ? x.sel.filter(y => y !== k) : [...x.sel, k]) : k })); } };\n      });\n    }\n    if (v.isOrder) {\n      const n = a.order.length;\n      v.orderItems = a.order.map((ci, pos) => {\n        const swap = d => { if (done) return; const p2 = pos + d; if (p2 < 0 || p2 >= n) return; this.upd(x => { const o = x.order.slice(); [o[pos], o[p2]] = [o[p2], o[pos]]; return { order: o }; }); };\n        return { label: q.items[ci], n: pos + 1, bg: done ? (ci === pos ? OKB : BADB) : '#FFFFFF', bd: done ? (ci === pos ? OKD : BADD) : '#D9DCE5',\n          up: () => swap(-1), down: () => swap(1), upOp: done || pos === 0 ? 0.3 : 1, downOp: done || pos === n - 1 ? 0.3 : 1 };\n      });\n    }\n    if (v.isMatch) {\n      const owner = j => { const k = Object.keys(a.pairs).find(k => a.pairs[k] === j); return k == null ? null : +k; };\n      v.leftItems = q.left.map((label, k) => {\n        const paired = a.pairs[k] != null, active = a.active === k;\n        let bg = active ? '#F6F7F9' : '#FFFFFF', bd = active ? '#111B44' : (paired ? PC[k] : '#D9DCE5');\n        if (done) { const ok = a.pairs[k] === k; bg = ok ? OKB : BADB; bd = ok ? OKD : BADD; }\n        return { label, n: paired || done ? k + 1 : '', badge: paired || active || done ? PC[k] : '#D9DCE5', bg, bd,\n          onClick: () => { if (done) return; this.upd(x => ({ active: x.active === k ? null : k })); } };\n      });\n      v.rightItems = q.rightOrder.map(j => {\n        const k = done ? j : owner(j);\n        let bg = '#FFFFFF', bd = k != null ? PC[k] : '#D9DCE5';\n        if (done) { const ok = owner(j) === j; bg = ok ? OKB : BADB; bd = ok ? OKD : BADD; }\n        return { label: q.right[j], n: k != null ? k + 1 : '', badge: k != null ? PC[k] : '#D9DCE5', bg, bd,\n          onClick: () => {\n            if (done) return;\n            this.upd(x => {\n              const p = { ...x.pairs };\n              Object.keys(p).forEach(kk => { if (p[kk] === j) delete p[kk]; });\n              if (x.active != null) p[x.active] = j;\n              return { pairs: p, active: null };\n            });\n          } };\n      });\n      const t = s.t ?? q.time;\n      v.showTimer = true;\n      v.timerText = Math.floor(t / 60).toString().padStart(2, '0') + ':' + (t % 60).toString().padStart(2, '0');\n      v.timerBg = t <= 20 && !done ? '#FAE6F1' : '#ECEDF2';\n      v.timerFg = t <= 20 && !done ? '#A80065' : '#111B44';\n    } else v.showTimer = false;\n    if (v.isOpen) { v.openText = a.text; v.onText = e => { const text = e.target.value; this.upd(() => ({ text })); }; }\n    if (done) {\n      if (q.type === 'open') { v.fbBg = '#ECEDF2'; v.fbFg = '#111B44'; v.fbTitle = 'صياغة نموذجية'; }\n      else if (a.ok) { v.fbBg = OKB; v.fbFg = OKD; v.fbTitle = 'إجابة صحيحة'; }\n      else { v.fbBg = '#FAE6F1'; v.fbFg = '#A80065'; v.fbTitle = q.type === 'match' && s.t === 0 ? 'انتهى الوقت' : 'ليست الإجابة الأدق'; }\n      v.fbText = q.explain;\n    }\n    const can = this.answered(q, a);\n    const last = s.i === Q.length - 1;\n    v.btnLabel = done ? (last ? 'عرض النتيجة' : 'التالي') : (q.type === 'open' ? 'إرسال' : 'تحقّق');\n    v.btnBg = done ? '#C50076' : (can ? '#111B44' : '#D9DCE5');\n    v.btnFg = done || can ? '#FFFFFF' : '#5E6789';\n    v.primary = () => done ? this.next() : this.check(false);\n    v.score = s.r.filter((x, k) => Q[k].type !== 'open' && x.ok).length;\n    v.scored = SCORED;\n    v.verdict = v.score >= 8 ? 'أداء متميز' : v.score >= 5 ? 'أداء جيد' : 'تحتاج إلى مراجعة';\n    v.verdictSub = v.score >= 8 ? 'أنت مستعد لتطبيق المبادئ في مذكرتك القادمة.' : v.score >= 5 ? 'راجع الأسئلة المعلَّمة باللون الوردي في الدليل.' : 'ننصح بالعودة إلى دليل المتدرب ثم إعادة المحاولة.';\n    v.summary = s.r.map((x, k) => {\n      const open = Q[k].type === 'open';\n      return { n: k + 1, bg: open ? '#D9DCE5' : x.ok ? '#1F7A55' : '#C50076', fg: open ? '#111B44' : '#FFFFFF' };\n    });\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
